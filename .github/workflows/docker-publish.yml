# Build the Crafty image and publish it to the GitHub Container Registry.
#
#   ghcr.io/ehrenmarmelade/crafty-4:latest        -> newest commit on main
#   ghcr.io/ehrenmarmelade/crafty-4:v4.10.7-mp.1  -> git tag v4.10.7-mp.1
#   ghcr.io/ehrenmarmelade/crafty-4:sha-<short>   -> every build
#
# Uses the workflow's own GITHUB_TOKEN (packages: write); no secrets needed.
name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/crafty-4

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read Crafty version
        id: ver
        run: |
          echo "crafty=$(python3 -c "import json;v=json.load(open('app/config/version.json'));print(f\"{v['major']}.{v['minor']}.{v['sub']}\")")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # image names must be lowercase on GHCR
          flavor: latest=${{ github.ref == 'refs/heads/main' }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Crafty Controller (modpack browser fork)
            org.opencontainers.image.description=Crafty Controller with Modrinth/CurseForge mod + modpack browser
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            BUILD_REF=${{ github.sha }}
            CRAFTY_VER=${{ steps.ver.outputs.crafty }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
