---
version: '3'

services:
  crafty:
    container_name: crafty_container
    build: ..
    restart: always
    environment:
      - TZ=Etc/UTC
      # Optional: needed for CurseForge modpacks / CurseForge-only mods
      # (Modrinth works without it). Get a key at https://console.curseforge.com
      # - CURSEFORGE_API_KEY=your_key_here
    ports:
      - "5520-5550:5520-5550/udp" # Hytale
      - "8000:8000" # HTTP
      - "8443:8443" # HTTPS
      - "8123:8123" # DYNMAP
      - "19132:19132/udp" # BEDROCK
      - "25500-25600:25500-25600" # MC SERV PORT RANGE
    volumes:
      - ./backups:/crafty/backups
      - ./logs:/crafty/logs
      - ./servers:/crafty/servers
      - ./config:/crafty/app/config
      - ./import:/crafty/import
